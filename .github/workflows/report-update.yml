name: OpenPrescribing Data Change Monitor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Report update mode"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - force
  schedule:
    - cron: "0 10 * * *" # Runs at 10:00 AM GMT every day

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Update EPD reports
      env:
        BQ_SERVICE_ACCOUNT_KEY: ${{ secrets.BQ_SERVICE_ACCOUNT_KEY }}
      run: >
        python src/main.py
        --mode ${{ github.event.inputs.mode || 'auto' }}
        --dataset epd

    - name: Update SCMD reports
      env:
        BQ_SERVICE_ACCOUNT_KEY: ${{ secrets.BQ_SERVICE_ACCOUNT_KEY }}
      run: >
        python src/main.py
        --mode ${{ github.event.inputs.mode || 'auto' }}
        --dataset scmd

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Commit changes
      id: commit
      run: |
        git add .

        if git diff --cached --quiet; then
          echo "No changes to commit"
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          git commit -m "Reports updated"
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Push changes
      if: steps.commit.outputs.changed == 'true'
      run: git push
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload GitHub Pages artifact
      if: steps.commit.outputs.changed == 'true'
      uses: actions/upload-pages-artifact@v5
      with:
        path: site

    - name: Deploy GitHub Pages
      if: steps.commit.outputs.changed == 'true'
      id: deployment
      uses: actions/deploy-pages@v5